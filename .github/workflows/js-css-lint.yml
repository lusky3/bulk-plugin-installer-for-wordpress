name: JS & CSS Lint

on:
  push:
    branches: [main]
    paths: ['assets/**', '.eslintrc*', '.stylelintrc*', 'package.json', '.github/workflows/js-css-lint.yml']
  pull_request:
    branches: [main]
    paths: ['assets/**', '.eslintrc*', '.stylelintrc*', 'package.json', '.github/workflows/js-css-lint.yml']

permissions:
  contents: read

jobs:
  oxlint:
    name: oxlint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run oxlint
        uses: oxc-project/oxlint-action@v3.1.0
        with:
          working-directory: assets/js

  stylelint:
    name: Stylelint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Stylelint with WordPress config
        run: npm install --no-save stylelint @wordpress/stylelint-config

      - name: Run Stylelint
        run: npx stylelint 'assets/css/**/*.css'
